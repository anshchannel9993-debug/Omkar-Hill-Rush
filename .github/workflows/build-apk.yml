name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=""
          if [[ "$JAVA_VERSION_OUTPUT" =~ version\ \"([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          fi

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Unable to detect active Java major version."
            exit 1
          fi

          echo "Detected active Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version is $JAVA_MAJOR, which is lower than 17. Java 17 or newer is required."
            exit 1
          fi

          echo "Java major version check passed: $JAVA_MAJOR >= 17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore does not exist and could not be created."
            exit 1
          fi

          echo "Debug keystore confirmed present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected debug APK not found at $TARGET_APK"
            echo "Searching inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK at $TARGET_APK is empty (size 0)."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $TARGET_APK"; exit 1 ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK is not app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "APK verification passed: $TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$ASSET_DIR"

          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          REPO_CLEAN=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="android-app"
          fi

          RUN_NUM="${{ github.run_number }}"
          ASSET_FILENAME="${REPO_CLEAN}-debug-build-${RUN_NUM}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Check ==="
          gh --version
          if ! command -v gh &> /dev/null; then
            echo "ERROR: gh CLI is not available."
            exit 1
          fi

          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_FILE" ] || [ ! -f "$ASSET_FILE" ]; then
            echo "ERROR: Prepared release asset does not exist at '$ASSET_FILE'."
            exit 1
          fi

          if [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Prepared release asset is empty: '$ASSET_FILE'."
            exit 1
          fi

          case "$ASSET_FILE" in
            *.apk) ;;
            *) echo "ERROR: Prepared release asset does not have .apk extension: '$ASSET_FILE'"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          NOTES=$(cat <<EOF
### Debug APK Build Information
- **Type**: Automatically generated debug APK
- **Builder**: GitHub Actions
- **Run Number**: ${{ github.run_number }}
- **Run Attempt**: ${{ github.run_attempt }}
- **Commit SHA**: ${{ github.sha }}

> **Notice**:
> - This APK is intended for testing.
> - The APK was built by GitHub Actions.
> - The APK is not a Play Store production release.
> - The APK is signed only with a temporary debug keystore.
EOF
)

          echo "Publishing GitHub Release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="${{ steps.publish_release.outputs.release_tag }}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
            echo "=== GitHub Release Published Successfully ==="
            echo "Release tag: $RELEASE_TAG"
            echo "Release title: Debug APK Build #${{ github.run_number }}"
            
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            echo "GitHub Release page URL: $RELEASE_URL"
            echo "APK asset filename: $ASSET_NAME"
            
            echo "=== gh release view confirmation ==="
            gh release view "$RELEASE_TAG"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** Debug APK Build #${{ github.run_number }}"
              echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "### 📱 Download Instructions"
              echo "The debug APK can be downloaded directly from the **Assets** section of the release page: [$RELEASE_URL]($RELEASE_URL)."
              echo ""
              echo "> **Backup:** The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available for download."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed."
            echo "=== APK Build Succeeded ==="
            echo "The debug APK build succeeded and the GitHub Actions artifact named 'app-debug-apk' remains available."

            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing the APK to GitHub Releases did not complete successfully."
              echo ""
              echo "The debug APK was built successfully and uploaded as a GitHub Actions artifact."
              echo "You can download the APK from the workflow run artifacts under the name **\`app-debug-apk\`**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
